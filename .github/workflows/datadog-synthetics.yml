name: Datadog Synthetics

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  datadog-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        name: Check Datadog configuration
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          if [[ -n "$DD_API_KEY" && -n "$DD_APP_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Datadog credentials configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Datadog credentials are not configured; skipping Synthetics."
          fi

  synthetics:
    needs: datadog-preflight
    if: ${{ needs.datadog-preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@v4.1.1
        with:
          api-key: ${{ secrets.DD_API_KEY }}
          app-key: ${{ secrets.DD_APP_KEY }}
