name: Release Desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Rebuild native modules
        run: npm run rebuild
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build Windows installers
        run: npx electron-builder --win nsis portable
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" release/* --generate-notes --title "Potencia Desktop $env:GITHUB_REF_NAME"
